name: meta-cor
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
  api:
    image: ${DOCKERHUB_USERNAME}/meta-cor-api:${TAG:-latest}
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/metawealth
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_ORIGIN: ${SITE_URL}
      SITE_URL: ${SITE_URL}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    volumes: [uploads:/app/backend/uploads]
  web:
    image: ${DOCKERHUB_USERNAME}/meta-cor-web:${TAG:-latest}
    restart: unless-stopped
    depends_on: [api]
    ports: ["${WEB_PORT:-8083}:80"]
volumes:
  mongo-data:
  uploads:
